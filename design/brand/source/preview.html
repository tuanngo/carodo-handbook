<!doctype html>
<!-- Brand preview sheet. Open in a browser, or render to ../preview/ with build.sh. -->
<html><head><meta charset="utf-8"><title>Carodo brand preview</title>
<style>
  body { margin: 0; width: 1600px; font: 600 13px -apple-system, system-ui, sans-serif; color: #77736D; background: #1c1b1a; }
  .row { display: flex; gap: 40px; align-items: center; padding: 32px 48px; }
  .dark { background: #242321; } .light { background: #F3EEE5; }
  .label { width: 130px; flex: none; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon { border-radius: 22.37%; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .icon img { display: block; width: 100%; height: 100%; }
  .icon.on-dark { background: linear-gradient(#3a3835, #1c1b1a); }
  .icon.tint { background: linear-gradient(#2b2b2b, #111); }
  .tint img { filter: sepia(1) saturate(3) hue-rotate(160deg); } /* stands in for iOS tinting */
</style></head><body>
<div class="row dark"><div class="label">Lockup · dark</div><img src="../svg/carodo-lockup-on-dark.svg" height="150"></div>
<div class="row light"><div class="label">Lockup · light</div><img src="../svg/carodo-lockup-on-light.svg" height="150"></div>
<div class="row dark"><div class="label">Mark · dark<br>200 · 96 · 48 · 32s · 20s</div>
  <img src="../svg/carodo-mark-on-dark.svg" width="200"><img src="../svg/carodo-mark-on-dark.svg" width="96">
  <img src="../svg/carodo-mark-on-dark.svg" width="48"><img src="../svg/carodo-mark-small-on-dark.svg" width="32">
  <img src="../svg/carodo-mark-small-on-dark.svg" width="20">
  <img src="../svg/carodo-wordmark-on-dark.svg" height="48" style="margin-left:40px"></div>
<div class="row light"><div class="label">Mark · light<br>200 · 96 · 48 · 32s · 20s</div>
  <img src="../svg/carodo-mark-on-light.svg" width="200"><img src="../svg/carodo-mark-on-light.svg" width="96">
  <img src="../svg/carodo-mark-on-light.svg" width="48"><img src="../svg/carodo-mark-small-on-light.svg" width="32">
  <img src="../svg/carodo-mark-small-on-light.svg" width="20">
  <img src="../svg/carodo-wordmark-on-light.svg" height="48" style="margin-left:40px"></div>
<div class="row dark"><div class="label">App icon<br>light · dark · tinted<br>180 · 60 · 29</div>
  <div class="icon" style="width:180px;height:180px"><img src="../svg/appicon-light.svg"></div>
  <div class="icon on-dark" style="width:180px;height:180px"><img src="../svg/appicon-dark.svg"></div>
  <div class="icon tint" style="width:180px;height:180px"><img src="../svg/appicon-tinted.svg"></div>
  <div class="icon" style="width:60px;height:60px"><img src="../svg/appicon-light.svg"></div>
  <div class="icon on-dark" style="width:60px;height:60px"><img src="../svg/appicon-dark.svg"></div>
  <div class="icon" style="width:29px;height:29px;border-radius:7px"><img src="../svg/appicon-light.svg"></div>
</div>
<div class="row dark"><div class="label">Export · iOS<br>AppIcon.appiconset<br>light · dark · tinted</div>
  <div class="icon" style="width:150px;height:150px"><img src="../export/ios/AppIcon.appiconset/AppIcon.png"></div>
  <div class="icon on-dark" style="width:150px;height:150px"><img src="../export/ios/AppIcon.appiconset/AppIcon-Dark.png"></div>
  <div class="icon tint" style="width:150px;height:150px"><img src="../export/ios/AppIcon.appiconset/AppIcon-Tinted.png"></div>
</div>
<div class="row light"><div class="label">Export · web<br>favicon 48·32·16 ·<br>touch 180 · maskable · OG</div>
  <div class="stack"><img src="../export/web/favicon.ico" width="48"><img src="../export/web/favicon.ico" width="32"><img src="../export/web/favicon.ico" width="16"></div>
  <div class="stack"><img src="../export/web/favicon.svg" width="32"><span>favicon.svg<br>(light scheme)</span></div>
  <img src="../export/web/apple-touch-icon.png" width="90" style="border-radius:20px">
  <img src="../export/web/icon-maskable-512.png" width="120" style="border-radius:50%">
  <img src="../export/web/og-image.png" width="480">
</div>
</body></html>
